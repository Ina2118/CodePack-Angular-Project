  <div class="forgot-container">
    <div class="forgot-card">
    <h2 class="forgot-title">Forgot Password</h2>
    <p>Enter the email used for your account and we'll send you a link to reset your password</p>

    <div class="input-box">
      <i class="fa-solid fa-envelope"></i>
      <input class="forgot-input" type="email" placeholder="Enter your email" [(ngModel)]="email" />
    </div>

    <button (click)="resetPassword()" class="forgot-btn">Reset Password</button>

    <p class="success" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <a routerLink="/login" class="back-link"> Back to login </a>
  </div>
</div>
